<!doctype html>
<html lang="en" data-direction="warm" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daynori Phase 67 — Interactive prototype (not production)</title>
    <link rel="stylesheet" href="css/directions.css" />
    <link rel="stylesheet" href="css/prototype.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="banner-proto" role="status">
      PROTOTYPE ONLY — simulated state. Does not authenticate, sync, upload, charge, or call AI
      providers. Phase 66 navigation policy is illustrated, not reimplemented as production code.
    </div>
    <div class="review-bar" role="region" aria-label="Prototype review controls">
      <div class="cluster">
        <strong>Direction</strong>
        <button type="button" class="chip" id="dir-warm" aria-pressed="true">Warm notebook</button>
        <button type="button" class="chip" id="dir-crisp" aria-pressed="false">Crisp utility</button>
        <strong>Theme</strong>
        <button type="button" class="chip" id="theme-light" aria-pressed="true">Light</button>
        <button type="button" class="chip" id="theme-dark" aria-pressed="false">Dark</button>
      </div>
      <div class="cluster">
        <button type="button" class="btn secondary" id="btn-states">State gallery</button>
        <button type="button" class="btn secondary" id="btn-assistant">Assistant</button>
        <a class="btn ghost" href="index.html">Hub</a>
      </div>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <div id="app"></div>
    <script src="js/app.js"></script>
  </body>
</html>
