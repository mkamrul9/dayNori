<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Daynori</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background-color: #fdfcfb;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .card {
        max-width: 440px;
        margin: 24px;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        text-align: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #475569;
        margin-top: 0;
        margin-bottom: 24px;
      }
      button {
        background-color: #0f172a;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        min-height: 44px;
        min-width: 44px;
      }
      button:hover {
        background-color: #1e293b;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <img
        src="/brand/daynori-logo.svg"
        alt="Daynori"
        width="138"
        height="40"
        style="margin-bottom: 24px"
      />
      <h1>You are currently offline</h1>
      <p>
        Daynori is operating in offline mode. Your drafts and local organizer items remain saved on
        this device. Reconnect to the internet to sync recent updates.
      </p>
      <button onclick="window.location.reload()">Try Reconnecting</button>
    </main>
  </body>
</html>
