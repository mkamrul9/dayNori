<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Daynori Vault — Browser WebCrypto Harness (Phase 44)</title>
    <style>
      body {
        font-family: ui-monospace, Consolas, monospace;
        margin: 1.5rem;
        background: #111;
        color: #eee;
      }
      pre {
        white-space: pre-wrap;
        background: #1c1c1c;
        padding: 1rem;
        border-radius: 6px;
      }
      .pass {
        color: #6f6;
      }
      .fail {
        color: #f66;
      }
      .meta {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <h1>Browser WebCrypto AES-256-GCM harness</h1>
    <p class="meta">
      Isolated proof harness. Not an unlock screen. Record browser/engine versions from the
      results block. This file must be served or opened in a real browser — Node execution does
      not satisfy this evidence.
    </p>
    <pre id="out">Running…</pre>
    <script type="module">
      const out = document.getElementById('out');
      const lines = [];
      const log = (msg, cls) => {
        lines.push((cls ? `[${cls}] ` : '') + msg);
        out.textContent = lines.join('\n');
        out.className = cls === 'fail' ? 'fail' : out.className;
      };

      function b64(buf) {
        const bytes = new Uint8Array(buf);
        let s = '';
        for (const b of bytes) s += String.fromCharCode(b);
        return btoa(s);
      }
      function fromB64(s) {
        const bin = atob(s);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }
      function canonicalAad(ctx) {
        return JSON.stringify({
          keyVersion: ctx.keyVersion,
          schemaVersion: ctx.schemaVersion,
          itemType: ctx.itemType,
          itemId: ctx.itemId,
          workspaceId: ctx.workspaceId,
        });
      }

      async function aesGcmRoundTrip() {
        const keyBytes = crypto.getRandomValues(new Uint8Array(32));
        const nonce = crypto.getRandomValues(new Uint8Array(12));
        const ctx = {
          workspaceId: '11111111-1111-4111-8111-111111111111',
          itemId: '22222222-2222-4222-8222-222222222222',
          itemType: 'vault_note',
          schemaVersion: 1,
          keyVersion: 1,
        };
        const aad = new TextEncoder().encode(canonicalAad(ctx));
        const plaintext = new TextEncoder().encode(
          'Browser harness: গোপন ভল্ট + binary \u0000\u0001'
        );

        const key = await crypto.subtle.importKey(
          'raw',
          keyBytes,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: nonce, additionalData: aad, tagLength: 128 },
          key,
          plaintext
        );
        const full = new Uint8Array(encrypted);
        const ct = full.slice(0, full.length - 16);
        const tag = full.slice(full.length - 16);

        // Tamper rejection
        const tampered = full.slice();
        tampered[0] ^= 1;
        let tamperRejected = false;
        try {
          await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: nonce, additionalData: aad, tagLength: 128 },
            key,
            tampered
          );
        } catch {
          tamperRejected = true;
        }

        const decrypted = new Uint8Array(
          await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: nonce, additionalData: aad, tagLength: 128 },
            key,
            full
          )
        );
        const ok =
          decrypted.length === plaintext.length &&
          decrypted.every((b, i) => b === plaintext[i]) &&
          tamperRejected;

        return {
          ok,
          nonceB64: b64(nonce),
          ciphertextB64: b64(ct),
          tagB64: b64(tag),
          tagLen: tag.length,
          nonceLen: nonce.length,
          keyLen: keyBytes.length,
          tamperRejected,
          plaintextUtf8: new TextDecoder().decode(decrypted),
        };
      }

      // NIST SP 800-38D Appendix C Test Case 13 (empty PT/AAD)
      async function nistCase13() {
        const key = await crypto.subtle.importKey(
          'raw',
          new Uint8Array(32),
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt']
        );
        const encrypted = new Uint8Array(
          await crypto.subtle.encrypt(
            {
              name: 'AES-GCM',
              iv: new Uint8Array(12),
              additionalData: new Uint8Array(0),
              tagLength: 128,
            },
            key,
            new Uint8Array(0)
          )
        );
        const tagHex = [...encrypted]
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
        return tagHex === '530f8afbc74536b9a963b4f1c4cb738b';
      }

      try {
        log(`userAgent: ${navigator.userAgent}`, 'meta');
        log(`crypto.subtle present: ${!!crypto?.subtle}`, 'meta');
        log(`executedAt: ${new Date().toISOString()}`, 'meta');
        log('status: UNVERIFIED until recorded in phase-44 report with this browser output', 'meta');

        const nistOk = await nistCase13();
        log(`NIST SP 800-38D Appendix C Case 13 tag: ${nistOk ? 'PASS' : 'FAIL'}`, nistOk ? 'pass' : 'fail');

        const rt = await aesGcmRoundTrip();
        log(
          `AES-256-GCM Unicode/binary round-trip + tamper: ${rt.ok ? 'PASS' : 'FAIL'}`,
          rt.ok ? 'pass' : 'fail'
        );
        log(`keyLen=${rt.keyLen} nonceLen=${rt.nonceLen} tagLen=${rt.tagLen}`, 'meta');
        log(`tamperRejected=${rt.tamperRejected}`, 'meta');
        log(`sample envelope nonce(b64)=${rt.nonceB64}`, 'meta');
        log(`sample tag(b64)=${rt.tagB64}`, 'meta');

        // Reject 16-byte key import attempt for AES-GCM length 256 where supported
        let shortKeyRejected = false;
        try {
          const shortKey = await crypto.subtle.importKey(
            'raw',
            new Uint8Array(16),
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt']
          );
          await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv: new Uint8Array(12), tagLength: 128 },
            shortKey,
            new Uint8Array([1])
          );
        } catch {
          shortKeyRejected = true;
        }
        log(
          `16-byte key with AES-256 intent rejected by browser: ${shortKeyRejected ? 'PASS' : 'FAIL (browser accepted)'}`,
          shortKeyRejected ? 'pass' : 'fail'
        );

        const all = nistOk && rt.ok && shortKeyRejected;
        log(all ? 'HARNESS RESULT: PASS' : 'HARNESS RESULT: FAIL', all ? 'pass' : 'fail');
      } catch (err) {
        log(`HARNESS RESULT: ERROR ${err && err.message ? err.message : err}`, 'fail');
      }
    </script>
  </body>
</html>
